name: Release

# 自动构建多平台预编译二进制并上传到 GitHub Release。
#
# 触发方式：推送形如 `v0.1.0` 的 tag 时自动运行。
#   git tag v0.1.0
#   git push origin v0.1.0
#
# 产物：
#   sap-for-agents-x86_64-pc-windows-msvc.zip
#   sap-for-agents-linux-x86_64.tar.gz
#   sap-for-agents-linux-aarch64.tar.gz
#   sap-for-agents-darwin-x86_64.tar.gz
#   sap-for-agents-darwin-aarch64.tar.gz
#
# 注意：预编译二进制不包含 SAP NWRFC SDK（受版权限制）。
# 用户仍需：
#   1. 注册 SAP Support Portal 账号，下载 SAP NWRFC SDK
#   2. 把库文件放到 nwrfcsdk/lib/<os>-<arch>/，或通过环境变量 SAP_SDK_DIR 指向已安装路径
# 详见 README §「下载预编译二进制」。

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # 发版一致性闸门：tag 名（去 v 前缀）必须等于 Cargo.toml 的 version。
  # 防止"tag 了 v0.11.0 但忘了 bump toml"→ Release 名对、二进制自报旧版本
  # （/api/version、MCP serverInfo 都读 Cargo.toml，版本可信度依赖此校验）。
  check-version:
    name: Verify tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tag == Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VER="$(grep -m1 '^version' Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')"
          echo "tag: ${TAG}, Cargo.toml: ${CARGO_VER}"
          if [ "${TAG}" != "${CARGO_VER}" ]; then
            echo "::error::tag v${TAG} does not match Cargo.toml version ${CARGO_VER} — bump Cargo.toml before tagging"
            exit 1
          fi

  build:
    needs: check-version
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Unix 系：在 CI 上自动 build（用空 .so/.dylib 满足 build.rs 占位）
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
            binary: sap_for_agents
            platform_dir: linux-x86_64
            lib_name: libsapnwrfc.so
            cc: cc
            cross_compile: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
            binary: sap_for_agents
            platform_dir: linux-aarch64
            lib_name: libsapnwrfc.so
            cc: aarch64-linux-gnu-gcc
            cross_compile: true
            linker: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
            binary: sap_for_agents
            platform_dir: darwin-x86_64
            lib_name: libsapnwrfc.dylib
            cc: cc
            cross_compile: false
            mac_target: x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
            binary: sap_for_agents
            platform_dir: darwin-aarch64
            lib_name: libsapnwrfc.dylib
            cc: cc
            cross_compile: false
            mac_target: arm64
          # Windows：用 lib.exe 从 .def 生成 stub 导入库满足 MSVC 链接期符号解析，
          # 运行期由用户挂载真实 sapnwrfc.dll。详见 README §「下载预编译二进制」
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            binary: sap_for_agents.exe
            platform_dir: windows-x86_64
            lib_name: sapnwrfc.lib
            cc: cl
            cross_compile: false
            is_windows: true
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Windows：激活 MSVC 开发环境，把 lib.exe / link.exe 加入 PATH。
      # lib.exe 不会默认在 PATH 里，必须先激活（vsdevcmd）才能在 stub 步骤调用。
      - name: Set up MSVC dev environment (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # 安装 Linux aarch64 交叉编译工具链（gcc + linker）
      - name: Install aarch64 cross-toolchain (Linux only)
        if: matrix.cross_compile == true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      # 生成 build.rs 所需的「含库文件的目录」占位
      # 真正的 SAP SDK 受版权限制不能下载。
      # - Unix：Cargo 的 `dylib=sapnwrfc` + 链接器 unresolved-symbols 选项允许
      #   编译期不解析符号（运行时才查），故只需放一个空 .so/.dylib 占位。
      # - Windows：MSVC link.exe 必须链接期解析符号。用 lib.exe 从 .def 生成
      #   stub 导入库 sapnwrfc.lib，运行期由用户挂载真实 sapnwrfc.dll。
      - name: Prepare stub SDK (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          # macOS 交叉编译用 -arch，Linux 交叉编译用交叉编译器前缀
          CC_FOR_STUB: ${{ matrix.cc }}
          MAC_TARGET: ${{ matrix.mac_target }}
        run: |
          STUB=nwrfcsdk/lib/${{ matrix.platform_dir }}
          mkdir -p "$STUB"
          echo "int sapnwrfc_stub;" > /tmp/stub.c
          if [[ "${{ runner.os }}" == "macOS" && -n "$MAC_TARGET" ]]; then
            # macOS：通过 -arch 指定目标架构（x86_64 或 arm64）
            "$CC_FOR_STUB" -arch "$MAC_TARGET" -c /tmp/stub.c -o /tmp/stub.o
            "$CC_FOR_STUB" -arch "$MAC_TARGET" -shared -o "$STUB/${{ matrix.lib_name }}" /tmp/stub.o
          else
            # Linux：直接用 CC（本机 cc 或 aarch64-linux-gnu-gcc）
            "$CC_FOR_STUB" -c /tmp/stub.c -o /tmp/stub.o
            "$CC_FOR_STUB" -shared -o "$STUB/${{ matrix.lib_name }}" /tmp/stub.o
          fi
          ls -la "$STUB"
          # 验证生成的库文件架构是否正确
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            file "$STUB/${{ matrix.lib_name }}"
          else
            file "$STUB/${{ matrix.lib_name }}" || true
          fi

      - name: Prepare stub import lib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stub = "nwrfcsdk\lib\${{ matrix.platform_dir }}"
          New-Item -ItemType Directory -Force -Path $stub | Out-Null
          # 从 .def 生成 stub 导入库；lib.exe 由上一步 msvc-dev-cmd 加入 PATH。
          lib /def:sapnwrfc.def /machine:x64 /out:"$stub\${{ matrix.lib_name }}"
          Get-ChildItem $stub

      # 交叉编译时配置 cargo 使用正确的 linker
      - name: Set cargo linker for cross-compile
        if: matrix.cross_compile == true
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.${{ matrix.target }}]
          linker = "${{ matrix.linker }}"
          EOF
          cat .cargo/config.toml

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          cp README.md dist/
          cp .env.example dist/
          cp -r nwrfcsdk dist/nwrfcsdk
          # 把 stub 库清掉，避免用户误以为是真实 SDK
          # （Windows stub 是 .lib 导入库，Unix stub 是 .so/.dylib）
          find dist/nwrfcsdk/lib -name "libsapnwrfc.so" -delete
          find dist/nwrfcsdk/lib -name "libsapnwrfc.dylib" -delete
          find dist/nwrfcsdk/lib -name "sapnwrfc.lib" -delete
          find dist/nwrfcsdk/lib -name "*.zip" -delete
          cd dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            # windows-latest 的 Git Bash 不带 zip 命令，用预装的 7-Zip
            7z a -tzip ../sap-for-agents-${{ matrix.target }}.zip .
          else
            tar czf ../sap-for-agents-${{ matrix.target }}.tar.gz *
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: sap-for-agents-${{ matrix.target }}.${{ matrix.archive }}
          generate_release_notes: true
