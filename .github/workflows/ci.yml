name: CI

# 每次 push / PR 跑 clippy + 单测，保证回归。
# 集成测试（#[ignore]，需真 SAP）不在 CI 跑——CI 无 SAP NWRFC SDK。
#
# 关键：CI 用 stub libsapnwrfc.so 占位（导出全部 Rfc* 桩符号）满足
# 编译期链接 + 单测运行期 load（含新版 rustc 的 -z now 急切解析）。
# 单测不调 SAP FFI，桩函数体为空不影响；集成测试标 #[ignore] 默认跳过。

on:
  push:
  pull_request:

# 最小权限（2026-11-05 审计：无 permissions 块会继承仓库默认 token 范围）
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy-test:
    runs-on: ubuntu-latest
    steps:
      # actions 按 commit SHA 固定（可变 tag 是供应链风险）；SHA 对应 v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain (stable + clippy)
        # SHA 对应 stable（dtolnay/rust-toolchain 按分支滚动，SHA 锁定快照）
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Cache cargo
        # SHA 对应 v6
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # CI 无真实 SAP SDK（受版权限制）。生成 stub libsapnwrfc.so：
      # - 编译期：build.rs 要求链接 sapnwrfc，stub 提供符号占位
      # - 运行期：单测启动 load stub。stub 导出 ffi.rs 里 extern 声明的全部
      #   Rfc* 符号（void 桩）：新版 rustc 在 Linux 默认 full RELRO（-z now），
      #   测试二进制加载期急切解析所有符号——零符号的空 stub 会以
      #   "undefined symbol: RfcXxx" 拒载（2026-09-25 实证）。符号清单从
      #   ffi.rs 自动生成，新增 extern 自动覆盖。
      - name: Prepare stub SAP SDK
        run: |
          STUB=nwrfcsdk/lib/linux-x86_64
          mkdir -p "$STUB"
          grep -hoE 'pub fn Rfc[A-Za-z0-9_]+' src/ffi.rs \
            | awk '{print "void* " $3 "(void) { return 0; }"}' > /tmp/stub.c
          echo "int sapnwrfc_stub;" >> /tmp/stub.c
          echo "stub symbols: $(grep -c '^void Rfc' /tmp/stub.c)"
          cc -shared -fPIC -o "$STUB/libsapnwrfc.so" /tmp/stub.c
          ls -la "$STUB"

      # clippy：质量门禁（-D warnings 阻断；代码已清干净）
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # 单测门禁：默认跳过 #[ignore] 的 SAP 集成测试
      - name: Test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/nwrfcsdk/lib/linux-x86_64
        run: cargo test
