[package]
name = "sap_for_agents"
version = "0.12.0"
license = "MIT"
edition = "2021"
rust-version = "1.75"
repository = "https://github.com/Jack-Liang/sap-for-agents"

[[bin]]
name = "sap_for_agents"
path = "src/main.rs"

[dependencies]
# Web 服务（client 模式）
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
# 二进制字段 Base64 编解码
base64 = "0.23"
# 结构化日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 指标（Prometheus /metrics 端点）
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
# 限流（按 IP，可选 SAP_RATE_LIMIT_RPS）
governor = "0.10"
# Server 模式：同步 HTTP 客户端（回调线程内调用）+ TOML 配置
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
toml = "0.8"
# ST22 结构化读取：解析 ADT runtime dumps 的 Atom feed（/api/dumps/**）
quick-xml = "0.42"

[profile.release]
lto = true
# 不设 panic="abort"：保留 unwinding，handler 内的 panic 由 tokio 任务隔离
# 兜住（只断当前连接），不会杀死整个网关进程。对长跑服务，可用性 > 二进制体积。
codegen-units = 1
opt-level = "z"
strip = true

[dev-dependencies]
# axum 路由级集成测试（oneshot）
tower = { version = "0.5", features = ["util"] }
# 读取响应 body 到 bytes
http-body-util = "0.1"
